# Configuration for augmentation experiments

seeds:
  - 42
  - 123
  - 2026

target_minority_ratio: 0.30

smote:
  enabled: true
  k_neighbors: 5

adasyn:
  enabled: true
  n_neighbors: 5

classical_wgan:
  enabled: true
  latent_dim: 10
  hidden_dim: 128
  batch_size: 64
  epochs: 50
  learning_rate: 0.0001
  beta1: 0.0
  beta2: 0.9
  lambda_gp: 10
  n_critic: 5
