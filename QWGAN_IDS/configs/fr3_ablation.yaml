# Ablation campaign config - 20 epochs for fast verification.
version: "2.0.0"

contract:
  n_qubits: 10
  top_k: 20
  val_fraction: 0.2
  split_seed: 42
  transform_seed: 42
  mi_sample_cap: 20000

model:
  n_qubits: 10
  n_layers: 4
  backend: default.qubit
  diff_method: backprop
  lambda_gp: 10.0
  n_critic: 5
  beta1: 0.0
  beta2: 0.9
  latent_scale: 0.25
  learning_rate: 0.001

deviations:
  latent_scale: >-
    Set to 0.25 to prevent output mean collapse near pi/2 (see docs/fr3-generator-diagnosis.md).
  learning_rate: >-
    Set to 0.001 to ensure weights can move sufficiently within the training window.

training:
  attack_classes:
    - u2r
    - r2l
  seeds: [13, 42, 1337]
  epochs: 20
  batch_size: 64
  checkpoint_every: 5
  critic_hidden_dims: [128, 64]
  barren_plateau_variance: 1.0e-12
  mode_collapse_ratio: 0.1
  early_stop_patience: 3
  early_stop_check_every: 5
  early_stop_min_epochs: 5
  early_stop_tolerance: 0.001
