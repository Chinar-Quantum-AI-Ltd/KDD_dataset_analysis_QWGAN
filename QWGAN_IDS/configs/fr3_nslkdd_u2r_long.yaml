# FR-3 — extended schedule for the rarest NSL-KDD class.
#
# Why this file exists, rather than a longer `epochs` in fr3_nslkdd.yaml:
# an epoch is not a comparable unit across classes here. `r2l` has 797 training
# rows and therefore 13 generator updates per epoch; `u2r` has 42 rows and gets
# exactly one. Under the shared 30-epoch schedule `r2l` received 390 generator
# updates and its Wasserstein estimate flattened by roughly epoch 10, while
# `u2r` received 30 and was still rising at the end of training.
#
# This config gives `u2r` a comparable number of updates. Everything else —
# contract, model, seeds, WGAN-GP hyperparameters — is identical to
# fr3_nslkdd.yaml, so the two runs differ in schedule alone.
#
# Run it with:
#   python -m cqai.qwgan.cli --experiment configs/fr3_nslkdd_u2r_long.yaml
#
# Cost: ~900 training steps, roughly 13 minutes on CPU with default.qubit.

version: "1.0.0"

contract:
  n_qubits: 10
  top_k: 20
  val_fraction: 0.2
  split_seed: 42
  transform_seed: 42
  mi_sample_cap: 20000

model:
  n_qubits: 10
  n_layers: 4
  backend: default.qubit
  diff_method: backprop
  lambda_gp: 10.0
  n_critic: 5
  learning_rate: 0.0001
  beta1: 0.0
  beta2: 0.9

training:
  attack_classes:
    - u2r
  seeds: [13, 42, 1337]
  # 300 single-batch epochs == 300 generator updates, comparable to the 390
  # `r2l` received under the 30-epoch shared schedule.
  epochs: 300
  batch_size: 64        # clamped to the class size (42); rows are never padded
  checkpoint_every: 50
  critic_hidden_dims: [128, 64]
  barren_plateau_variance: 1.0e-12
  mode_collapse_ratio: 0.1
