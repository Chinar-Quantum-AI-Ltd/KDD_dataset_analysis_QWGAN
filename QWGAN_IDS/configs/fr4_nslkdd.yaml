# FR-4 — synthesis and the class-conditional fidelity gate on NSL-KDD.
#
# The thresholds below decide whether synthetic data is released to FR-5. They
# live under version control on purpose: a pass/fail claim is only readable next
# to the bands that produced it, and every run manifest records this file's
# resolved values verbatim. Change them in a commit, with a reason, never in an
# editor buffer before a run.
#
# Run it with:
#   python -m cqai.synthesis.cli --experiment configs/fr4_nslkdd.yaml --dry-run
#   python -m cqai.synthesis.cli --experiment configs/fr4_nslkdd.yaml

version: "1.0.0"

# --------------------------------------------------------------------------- #
# Must match the contract the generators were trained against. The CLI refuses
# a mismatch: gating against different transforms than the model was trained on
# would compare a sample with something it never had a chance to resemble.
# --------------------------------------------------------------------------- #
contract:
  n_qubits: 10
  top_k: 20
  val_fraction: 0.2
  split_seed: 42
  transform_seed: 42
  mi_sample_cap: 20000

# --------------------------------------------------------------------------- #
# Gate thresholds.
# --------------------------------------------------------------------------- #
thresholds:
  # TDD section 15.1 hard design threshold. 0.5 means indistinguishable.
  # This one is not a tunable: relaxing it would invalidate OBJ-1.
  max_c2st_auc: 0.65

  # Applied to the per-feature W-1 normalised by the real column's robust
  # spread, so one band covers `src_bytes` (thousands) and `same_srv_rate`
  # (bounded by 1) alike. These three are tolerance bands, not design
  # thresholds: they are first-pass values and any report that leans on them
  # must say so.
  max_wasserstein_1: 0.5
  max_ks_statistic: 0.2
  min_coverage: 0.5
  min_domain_validity: 0.95

  # Below this many held-out real rows the gate returns `insufficient_evidence`
  # rather than a verdict. NSL-KDD `u2r` has 10 held-out rows, so it is expected
  # to land here: a C2ST AUC computed against 10 rows cannot certify anything,
  # and reporting `pass` there would be worse than reporting nothing.
  min_real_samples: 50

  c2st_folds: 5

# --------------------------------------------------------------------------- #
# What to synthesise, and how much.
# --------------------------------------------------------------------------- #
synthesis:
  attack_classes:
    - u2r
    - r2l

  # FR-6 requires exactly three centrally configured seeds, matching FR-3's.
  seeds: [13, 42, 1337]

  # Fractions of the majority class. The TDD sweeps 0.2-0.4 and warns explicitly
  # against naive 1:1 balancing, which over-synthesises and degrades precision.
  ratios: [0.2, 0.3, 0.4]
  majority_class: normal

  # One generator per (class, seed). `u2r` is taken from the extended schedule
  # because it had not plateaued under the shared 30-epoch one; `r2l` plateaued
  # by roughly epoch 10 and its final checkpoint is used.
  checkpoints:
    u2r: artifacts/runs/fr3-nslkdd-u2r-long-001/checkpoints/u2r/seed{seed}/epoch0300.pt
    r2l: artifacts/runs/fr3-nslkdd-full-001/checkpoints/r2l/seed{seed}/epoch0030.pt

  # Samples per simulator call. 0.4 x 53 875 rows broadcast through
  # default.qubit in one call would allocate roughly 350 MB of statevector.
  chunk_size: 2048
